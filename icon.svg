<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Outer Dial Ring -->
  <circle cx="256" cy="256" r="190" fill="#0B132B" stroke="#1E293B" stroke-width="8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#3B82F6" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Cardinal Points -->
  <text x="256" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#60A5FA" text-anchor="middle">N</text>
  <text x="256" y="435" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#64748B" text-anchor="middle">S</text>
  <text x="430" y="264" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#64748B" text-anchor="middle">E</text>
  <text x="82" y="264" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#64748B" text-anchor="middle">O</text>

  <!-- Compass Needle: North (Blue) & South (Emerald) -->
  <polygon points="256,110 286,256 256,236 226,256" fill="url(#needleNorth)" filter="url(#glow)" />
  <polygon points="256,402 286,256 256,276 226,256" fill="url(#needleSouth)" />

  <!-- Compass Center Pin -->
  <circle cx="256" cy="256" r="22" fill="#1E293B" stroke="#60A5FA" stroke-width="4" />
  <circle cx="256" cy="256" r="8" fill="#FFFFFF" />

  <!-- Galicia star indicator -->
  <circle cx="340" cy="170" r="7" fill="#F59E0B" />
  <circle cx="340" cy="170" r="14" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.5" />
</svg>
