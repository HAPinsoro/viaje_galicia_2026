version: '3.8'

services:
  # ==========================================
  # 1. Aplicación Web Galicia Trip (Node + React SPA)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: galicia_trip_app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_2026}@postgres:5432/${POSTGRES_DB:-galicia_trip_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-AIzaSyD2M10m6SheEHKmLtfUcqS604NOyBy3PA4}
      - VITE_GOOGLE_MAPS_MAP_ID=${VITE_GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
      - APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - galicia_network

  # ==========================================
  # 2. Base de Datos PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: galicia_trip_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-galicia_trip_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-galicia_trip_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - galicia_network

volumes:
  postgres_data:
    driver: local

networks:
  galicia_network:
    driver: bridge
